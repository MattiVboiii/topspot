version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: main
    labels:
      - dependencies
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # pnpm-workspace.yaml pins jose to 4.15.9; a 5+ bump does not change the lockfile and fails the update job
      - dependency-name: jose
